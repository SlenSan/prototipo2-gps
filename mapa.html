<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recorrido Canino</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #encabezado {
      background: #3b82f6;
      color: white;
      padding: 12px 16px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }
    #info {
      padding: 10px 16px;
      background: #f1f5f9;
      font-size: 14px;
      border-bottom: 1px solid #cbd5e1;
    }
    #mapa { height: calc(100vh - 100px); }
  </style>
</head>
<body>

<div id="encabezado">🐾 Rastreo de Paseo Canino</div>
<div id="info">Cargando recorrido...</div>
<div id="mapa"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const mapa = L.map('mapa').setView([7.069, -73.854], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(mapa);

  let rutaLinea = null;
  let marcadorInicio = null;
  let marcadorFin = null;
  let marcadoresPuntos = [];

  function cargarRecorrido() {
    fetch('https://web-production-83993.up.railway.app/ultimo_recorrido')
      .then(res => res.json())
      .then(puntos => {
        if (puntos.length === 0) {
          document.getElementById('info').innerText = 'Sin recorridos aún.';
          return;
        }

        // Limpiar mapa anterior
        if (rutaLinea) mapa.removeLayer(rutaLinea);
        if (marcadorInicio) mapa.removeLayer(marcadorInicio);
        if (marcadorFin) mapa.removeLayer(marcadorFin);
        marcadoresPuntos.forEach(m => mapa.removeLayer(m));
        marcadoresPuntos = [];

        // Construir coordenadas
        const coords = puntos.map(p => [p.latitud, p.longitud]);

        // Dibujar línea
        rutaLinea = L.polyline(coords, { color: '#3b82f6', weight: 4 }).addTo(mapa);

        // Marcador en cada punto
        coords.forEach((coord, i) => {
          const m = L.circleMarker(coord, {
            radius: 4,
            color: '#3b82f6',
            fillColor: '#3b82f6',
            fillOpacity: 1
          }).addTo(mapa).bindPopup(`Punto ${i+1}: ${puntos[i].hora}`);
          marcadoresPuntos.push(m);
        });

        // Marcador inicio
        marcadorInicio = L.marker(coords[0])
          .addTo(mapa)
          .bindPopup(`🟢 Inicio: ${puntos[0].hora}`);

        // Marcador fin
        marcadorFin = L.marker(coords[coords.length - 1])
          .addTo(mapa)
          .bindPopup(`🔴 Fin: ${puntos[puntos.length - 1].hora}`);

        // Centrar mapa
        mapa.fitBounds(rutaLinea.getBounds());

        // Info
        document.getElementById('info').innerText =
          `📍 Puntos: ${puntos.length} | ⏱ Inicio: ${puntos[0].hora} | 🏁 Fin: ${puntos[puntos.length-1].hora}`;
      })
      .catch(err => {
        document.getElementById('info').innerText = 'Error conectando al servidor.';
      });
  }

  cargarRecorrido();
  setInterval(cargarRecorrido, 5000);
</script>
</body>
</html>
